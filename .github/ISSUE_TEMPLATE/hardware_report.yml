name: Hardware report
description: Tell us whether this worked (or didn't) on your laptop. Reports build the list of supported laptops.
title: "[Hardware] <laptop model>: works / partly / fails"
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Both successes and failures help. Please remove your drive serial numbers from anything you paste.
  - type: input
    id: laptop
    attributes:
      label: Laptop model
      placeholder: "ASUS TUF F16 (FX607VUR)"
    validations:
      required: true
  - type: input
    id: cpu_gpu
    attributes:
      label: CPU and GPU
      description: "From `lspci -nn | grep -iE 'vga|display'` and `lscpu | grep 'Model name'`"
      placeholder: "Intel Core i7-13650HX, Raptor Lake-P [8086:a7ab]"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Boots and is usable
        - Boots with problems
        - Does not boot
        - Failed during setup
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Display
        - label: Keyboard and touchpad
        - label: Wi-Fi
        - label: Bluetooth
        - label: Sound (speakers)
        - label: Sound (headphones)
        - label: Webcam
        - label: Battery status
  - type: textarea
    id: configure
    attributes:
      label: Output of `bash scripts/bm-configure.sh`
      description: Paste the "Things to know" part, and the firmware lines it detected.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Which step failed, what you changed, how long it took.
